plugins {
    id 'java'
    id 'jacoco'
    id 'groovy'
}

group = 'ru.nsu.g.solovev5.m.task241'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://repo.gradle.org/gradle/libs-releases' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.apache.groovy:groovy-all:5.0.0'
    implementation 'info.picocli:picocli:4.7.7'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'
    implementation 'com.puppycrawl.tools:checkstyle:12.3.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.gradle:gradle-tooling-api:9.4.1'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'org.thymeleaf:thymeleaf:3.1.2.RELEASE'
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

sourceSets {
    main {
        java.srcDirs = []
        groovy.srcDirs = ['src/main/java', 'src/main/groovy']
    }
    test {
        java.srcDirs = []
        groovy.srcDirs = ['src/test/java', 'src/test/groovy']
    }
}

test {
    useJUnitPlatform()
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}